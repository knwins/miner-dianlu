# ───────────────────────────────────────────────────────────────────────────
# TapeOut 众筹挖矿 · 生产环境官方市价反代
#
# 问题：
#   前端读官方数据走同源路径 /tt-api/*（市价、电路挂单快照）。
#   该路径在 dev / preview 下由 vite.config.js 的 server.proxy / preview.proxy
#   转发到 https://tapeout.net，但 `vite build` 产物里**不含**这个代理。
#   生产 Web 服务器若没配置下方反代，/tt-api/* 会被当成自身路由返回 404
#   —— 这就是 MEMORY.md 的 M-2 已知风险，也是线上「官方市价 / 卖单读取失败」的根因。
#
# 实测：https://tapeout.net/market.json 与 /circuit-market.json 本身返回 200；
#   线上 404 来自**你自己的生产服务器**（没有 /tt-api 路由），不是官方站点。
#
# 用法：
#   把下面 `location /tt-api/` 块并入「托管 frontend/dist 的 server { }」即可。
#   语义与 vite.config.js 完全一致：去掉 /tt-api 前缀，转发到 https://tapeout.net。
#   /tt-api/market.json           →  https://tapeout.net/market.json
#   /tt-api/circuit-market.json   →  https://tapeout.net/circuit-market.json
# ───────────────────────────────────────────────────────────────────────────

location /tt-api/ {
    # 末尾斜杠：把 /tt-api/ 之后的部分拼到 proxy_pass 之后
    proxy_pass https://tapeout.net/;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;        # 让 SNI 带对端主机名（Cloudflare 前必需）
    proxy_set_header Host tapeout.net;
    proxy_set_header Origin https://tapeout.net;
    proxy_set_header User-Agent "tapeout-crowd-miner";
    proxy_set_header Accept "application/json";
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
    proxy_intercept_errors off;      # 让上游状态码原样透传，便于前端区分 404/5xx
}
